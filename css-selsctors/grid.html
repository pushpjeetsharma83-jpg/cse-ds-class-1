<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </head>
    <style>
        html,*{
            margin: 0px;
            border: 0px;
            box-sizing: border-box;
          /* /  * background-color: #999; */ 
        
        }
           body{
            display: flex;
            justify-content: center;
            align-items: center;baseline;}


        main{
            width: 1200px;
            height: 400px;
            background-color:#ccc;
            margin: auto;
            display: grid;
            grid-template-rows: repeat(4,1fr);
            gap: 20px;
       
        }
        /* .box{
            background-color: #a82f2f;
            height: 320px;
            width: 300px;.} */

        .box :nth-child(odd){
            background-color: chocolate;
            height: 300px;
        }
        .box :nth-child(even){
            background-color: blue;
            height: 300px;
        }

        @media screen and (max-width:768) and (main-width:375) {
            main{
                display: grid;
                grid-template-columns: repeat(1,fr);
                gap: 20px;
                background-color: darkgreen;
            }
            
        }


       
    </style>

<body>
    <main>
     <div class="box">1</div>
     <div class="box">2</div>
     <div class="box">3</div>
     <div class="box">4</div>
    </main>
</body>
</html>
